name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle ShinyMac.app
        run: |
          ./scripts/bundle.sh
          ditto -c -k --keepParent build/ShinyMac.app build/ShinyMac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ShinyMac
          path: build/ShinyMac.zip
